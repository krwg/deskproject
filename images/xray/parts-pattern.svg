    <ellipse cx="112" cy="38" rx="16" ry="9"/>
    <ellipse cx="112" cy="38" rx="5" ry="3"/>
    <ellipse cx="152" cy="28" rx="16" ry="9"/>
    <ellipse cx="152" cy="28" rx="5" ry="3"/>
